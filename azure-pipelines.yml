trigger:
  branches:
    include:
      - main

stages:

# =====================================================
# STAGE 1: BUILD - Checkout adf_publish and Publish ARM
# =====================================================
- stage: Build
  displayName: "Build ARM Templates"

  jobs:
  - job: PublishARM
    displayName: "Publish ARM Template Artifact"

    pool:
      name: SelfPool

    steps:

    # ✅ Checkout adf_publish branch (ADF generates ARM here)
    - checkout: self
      persistCredentials: true

    - script: |
        echo "Switching to adf_publish branch..."
        git fetch origin
        git checkout adf_publish
      displayName: "Checkout adf_publish branch"

    # ✅ Publish ARM templates from adf_publish branch
    - task: PublishBuildArtifacts@1
      displayName: "Publish ARM Template Artifact"
      inputs:
        pathToPublish: "$(Build.SourcesDirectory)"
        artifactName: "adf_drop"


# =====================================================
# STAGE 2: DEPLOY TO UAT
# =====================================================
- stage: Deploy_UAT
  displayName: "Deploy to UAT"
  dependsOn: Build

  jobs:
  - job: DeployADF_UAT
    pool:
      name: SelfPool

    steps:
    - download: current
      artifact: adf_drop

    # ✅ Deploy ARM Template to UAT
    - task: AzureResourceGroupDeployment@2
      displayName: "Deploy ARM to UAT"
      inputs:
        azureSubscription: "UATPRODConn"
        action: "Create Or Update Resource Group"
        resourceGroupName: "multi-cloud-rg"
        location: "East US"

        templateLocation: "Linked artifact"

        csmFile: "$(Pipeline.Workspace)/adf_drop/ARMTemplateForFactory.json"
        csmParametersFile: "$(Pipeline.Workspace)/adf_drop/ARMTemplateParametersForFactory.json"

        overrideParameters: >
          -factoryName "denis-adf-uat"

        deploymentMode: "Incremental"


# =====================================================
# STAGE 3: DEPLOY TO PROD
# =====================================================
- stage: Deploy_PROD
  displayName: "Deploy to PROD"
  dependsOn: Deploy_UAT

  jobs:
  - job: DeployADF_PROD
    pool:
      name: SelfPool

    steps:
    - download: current
      artifact: adf_drop

    # ✅ Deploy ARM Template to PROD
    - task: AzureResourceGroupDeployment@2
      displayName: "Deploy ARM to PROD"
      inputs:
        azureSubscription: "UATPRODConn"
        action: "Create Or Update Resource Group"
        resourceGroupName: "multi-cloud-rg"
        location: "East US"

        templateLocation: "Linked artifact"

        csmFile: "$(Pipeline.Workspace)/adf_drop/ARMTemplateForFactory.json"
        csmParametersFile: "$(Pipeline.Workspace)/adf_drop/ARMTemplateParametersForFactory.json"

        overrideParameters: >
          -factoryName "denis-adf-prd"

        deploymentMode: "Incremental"
